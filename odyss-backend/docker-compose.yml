version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odyss_user
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: odyss_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: flask run --host=0.0.0.0
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    depends_on:
      - db

volumes:
  pgdata:
